[package]
name = "doppeldecker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "doppeldecker-cli"
path = "src/main.rs"

[dependencies]
doppeldecker-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
keyring = "4.1.4"
blake3 = "1"
percent-encoding = "2"
serde = "1"
serde_json = "1"
url = "2"
zeroize = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
